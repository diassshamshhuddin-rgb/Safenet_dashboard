[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "safenet-kz"
version = "0.1.0"
description = "Цифровой щит против незаконных схем в соцсетях и мессенджерах Казахстана (SafeNet KZ)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "SafeNet KZ Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "networkx>=3.2.1",
    "streamlit>=1.44.0",
    "pillow>=10.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]