# SafeNet KZ — Цифровой щит против незаконных схем в соцсетях и мессенджерах
# Конфигурация системы выявления признаков рискованного контента

app:
  name: "SafeNet KZ Prototype"
  version: "0.1.0"
  disclaimer: "ВНИМАНИЕ: Система не выносит вердиктов о законности схем. Выявляются лишь признаки возможного нарушения для последующей ручной проверки профильным аналитиком/модератором согласно законодательству РК."

# Треки мониторинга
tracks:
  - id: "lottery"
    name: "Розыгрыши под контролем"
    description: "Лотереи с признаками платного участия и случайного выигрыша"
  - id: "casino"
    name: "Скрытая игра"
    description: "Скрытое продвижение онлайн-казино, зеркал и реферальных схем"
  - id: "pyramid"
    name: "Стоп-пирамида"
    description: "Финансовые пирамиды в WhatsApp/Telegram и нереалистичные обещания доходности"

# Градация уровней риска (шкала 0 - 100)
risk_levels:
  low:
    min_score: 0.0
    max_score: 39.9
    label: "Низкий риск"
    action: "Автоматический пропуск или фоновый лог"
  medium:
    min_score: 40.0
    max_score: 69.9
    label: "Средний риск"
    action: "Рекомендована выборочная проверка аналитиком"
  high:
    min_score: 70.0
    max_score: 100.0
    label: "Высокий риск"
    action: "Приоритетная ручная модерация профильным ведомством"

# Базовые веса модулей в гибридном скоринге
scoring:
  rule_weight: 0.60
  graph_weight: 0.25
  multimodal_weight: 0.15

# Пороги графового усиления
graph:
  shared_card_risk_boost: 25.0
  shared_domain_risk_boost: 20.0
  centrality_high_threshold: 0.35

# Настройки языковой нормализации
languages:
  supported: ["ru", "kk", "mixed", "translit"]
  default: "ru"